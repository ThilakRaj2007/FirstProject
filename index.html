<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FORM TUTORIAL</title>
    </head>
    <body style="color: ghostwhite;background-color: black;">
        <form action="">
                <label for="">Name:</label>
                <input type="text"><br>
                <label for="">Email:</label>
                <input type="text"><br>
                <label>Password:</label>
                <input type="text"><br>

                <input type="radio" name="Gender">Male
                <input type="radio" name="Gender">Female<br>
                <label>Languages Known:</label>
                <input type="checkbox">Tamil<br>
                <input type="checkbox">English<br>
                <input type="checkbox">Hindi<br>
                <label>Country:</label>
                <select name="Countrty" id="">
                    <option value="India">India</option>
                    <option value="USA">USA</option>
                    <option value="UK">UK</option>
                    <option value="Australia">Australia</option>
                    <option value="Germany">Germany</option>
                    <option value="Scotland">Scotland</option>
                    <option value="Ireland">Ireland</option>
                    <option value="Japan">Japan</option>
                    <option value="Singapore">Singapore</option>
                    <option value="China">China</option>
                    <option value="India">India</option>
                </select><br>
                <label>DOB(Date Of Birth):</label>
                <input type="date"><br>
                <label>upload Your Resume:</label>
                <input type="file"><br>
                <label>Comments:</label><br>
                <textarea name="comments" id="" rows="10" cols="60" placeholder="Type your comments here"></textarea><br>
                <button>Reset</button>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                <button>Submit</button>
          </table>
        </form>
    </body>
</html>
